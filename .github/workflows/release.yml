name: Build and Release

on:
  push:
    tags:
      - '*'  # Se déclenche sur tous les tags

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Installer Python et PyInstaller
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    # 3. Zipper le dossier blue_frontline
    - name: Zip source code
      run: |
        cd blue_frontline
        zip -r ../blue_frontline_source.zip .

    # 4. Compiler avec PyInstaller
    - name: Build with PyInstaller
      run: |
        cd blue_frontline
        pyinstaller BlueFrontline.spec

    # 5. Créer la release GitHub
    - name: Create GitHub release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 6. Uploader les fichiers générés
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          blue_frontline_source.zip
          blue_frontline/dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
