name: Build and Release

on:
    push:
        tags:
            - "*" # Se déclenche sur tous les tags

jobs:
    build-and-release:
        runs-on: windows-latest
        permissions:
            contents: write

        steps:
            # 1. Récupérer le code
            - name: Checkout repository
              uses: actions/checkout@v3

            # 2. Installer Python et PyInstaller
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pyinstaller

            # 3. Zipper le dossier blue_frontline
            - name: Zip source code
              run: |
                  cd blue_frontline
                  Compress-Archive -Path * -DestinationPath ../blue_frontline_source.zip

            # 4. Compiler avec PyInstaller
            - name: Build with PyInstaller
              run: |
                  cd blue_frontline
                  pyinstaller BlueFrontline.spec

            # 5. Créer la release GitHub
            - name: Create and upload release
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      blue_frontline_source.zip
                      blue_frontline/dist/BlueFrontline.exe
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-and-release-linux:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            # 1. Récupérer le code
            - name: Checkout repository
              uses: actions/checkout@v3

            # 2. Installer Python et PyInstaller
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pyinstaller

            # 3. Zipper le dossier blue_frontline
            - name: Zip source code
              run: |
                  cd blue_frontline
                  zip -r ../blue_frontline_source_linux.zip .

            # 4. Compiler avec PyInstaller
            - name: Build with PyInstaller
              run: |
                  cd blue_frontline
                  pyinstaller BlueFrontline.spec

            # 5. Créer la release GitHub
            - name: Create and upload release
              uses: softprops/action-gh-release@v1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  files: |
                      blue_frontline_source_linux.zip
                      blue_frontline/dist/BlueFrontline
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
